plugins {
    id 'com.android.application'
}

// 调试用的大模型 key、讯飞密钥放在 local.properties（已被 .gitignore 排除）：llm.apiKey=sk-xxx
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }

android {
    namespace 'com.raferlyan.hark'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raferlyan.hark'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
        ndk { abiFilters 'arm64-v8a' }
        // 发布包里不带 key，用户在设置里自己填
        buildConfigField 'String', 'LLM_DEBUG_KEY', '""'
        buildConfigField 'String', 'XF_DEBUG_APP_ID', '""'
        buildConfigField 'String', 'XF_DEBUG_API_KEY', '""'
        buildConfigField 'String', 'XF_DEBUG_API_SECRET', '""'
    }
    buildFeatures {
        buildConfig true
    }

    // 预置成系统应用后（平台密钥签名），adb install 覆盖升级必须用同一把密钥签。
    // 在 local.properties 里配 platform.storeFile / storePassword / keyAlias / keyPassword 就用它，
    // 没配用 debug 密钥。平台密钥转 keystore 的方法见 aosp/README.md
    signingConfigs {
        if (localProps.getProperty('platform.storeFile')) {
            platform {
                storeFile rootProject.file(localProps.getProperty('platform.storeFile'))
                storePassword localProps.getProperty('platform.storePassword')
                keyAlias localProps.getProperty('platform.keyAlias')
                keyPassword localProps.getProperty('platform.keyPassword')
            }
        }
    }
    def appSigning = signingConfigs.findByName('platform') ?: signingConfigs.debug

    buildTypes {
        debug {
            signingConfig appSigning
            buildConfigField 'String', 'LLM_DEBUG_KEY', "\"${localProps.getProperty('llm.apiKey', '')}\""
            // 讯飞听写：xf.appId / xf.apiKey / xf.apiSecret
            buildConfigField 'String', 'XF_DEBUG_APP_ID', "\"${localProps.getProperty('xf.appId', '')}\""
            buildConfigField 'String', 'XF_DEBUG_API_KEY', "\"${localProps.getProperty('xf.apiKey', '')}\""
            buildConfigField 'String', 'XF_DEBUG_API_SECRET', "\"${localProps.getProperty('xf.apiSecret', '')}\""
        }
        release {
            minifyEnabled false
            signingConfig appSigning
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {
    implementation files('libs/sherpa-onnx-1.13.8-rknn.aar')
}
